name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Cancel an in-flight deploy if a newer commit lands on main; no point
  # pushing a build that is already superseded.
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --remote-only runs the Docker build on Fly's builders so we don't
      # ship the image across the public internet from GitHub.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
