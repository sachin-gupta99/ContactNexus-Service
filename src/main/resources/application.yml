spring:
  application:
    name: contactnexus-service

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

aws:
  ssm:
    region: ap-south-1

db:
  url: /ContactNexus/Service/postgres-db/url
  username: /ContactNexus/Service/postgres-db/username
  password: /ContactNexus/Service/postgres-db/password
  driver-class-name: org.postgresql.Driver

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
