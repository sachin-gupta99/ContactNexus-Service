spring:
  application:
    name: contactnexus-service

  servlet:
    multipart:
      # Defaults are 1MB/10MB; a typical phone photo blows past 1MB and Tomcat
      # rejects it with a bare 413 that carries no CORS headers, which surfaces
      # in the browser as a misleading CORS error. Keep in sync with
      # MAX_IMAGE_BYTES in ContactNexus-UI/src/components/ImagePicker.jsx.
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only checks that the running
      # entity model still matches what's in the database. Any mismatch is a
      # loud boot failure instead of a silent `ddl-auto: update` surprise.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # The production Neon DB already has the schema from the old `ddl-auto: update`
    # era. baseline-on-migrate stamps that existing state as V1 the first time
    # Flyway runs - V1__init.sql is NOT executed against an already-populated DB.
    # On a fresh DB (local Docker, Testcontainers, a new Neon branch) V1 runs
    # in full so the schema matches current entities.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing schema from Hibernate ddl-auto"

  # Gmail SMTP for transactional email (password reset + change confirmation).
  # In prod set MAIL_USERNAME + MAIL_PASSWORD (a Google App Password, not the
  # account password). Locally leave them unset and app.email.mode defaults to
  # `console` so reset links are logged instead of sent.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

aws:
  ssm:
    region: ap-south-1
  s3:
    # Private bucket (all public access blocked); avatars are served through
    # presigned GET URLs. Credentials come from the AWS default provider chain.
    bucket: ${S3_BUCKET:contact-nexus}
    region: ${S3_REGION:ap-south-1}
    # How long a returned avatar URL stays valid. The UI only refetches the user
    # on page load, so this should outlast a typical open tab.
    presign-ttl: PT12H

db:
  url: /ContactNexus/database/directUrl
  username: /ContactNexus/database/username
  password: /ContactNexus/database/password
  driver-class-name: org.postgresql.Driver

cors:
  # ContactNexus-UI dev server (vite.config.js pins 3000; 5173 is Vite's fallback)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  # Resolution order: this value, then the SSM parameter, then an ephemeral key
  # (dev only - an ephemeral key invalidates every token on restart).
  secret: ${JWT_SECRET:}
  secret-parameter: /ContactNexus/jwt/secret
  # Access token TTL is short so a stolen bearer dies fast; refresh TTL is long
  # because the refresh token is opaque + revocable server-side.
  access-ttl: PT15M
  refresh-ttl: P7D
  # Cookie flags for the refresh-token cookie. Flip both in prod (over HTTPS with
  # a cross-origin UI, SameSite must be None and Secure must be true).
  refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

app:
  client-ip:
    # Shared secret Vercel adds as X-Origin-Secret on the /api rewrite (see the
    # UI's vercel.json). When it matches, the left-most X-Forwarded-For value
    # (which Vercel overwrites) is the visitor. Unset = old behaviour + a warning.
    proxy-secret: ${PROXY_SECRET:}
    # Header the edge in front of this service sets itself, used for requests
    # that bypass Vercel. Render: CF-Connecting-IP. Empty = socket address.
    edge-header: ${CLIENT_IP_EDGE_HEADER:}
  # Public URL of the UI - used to build password reset links that land users
  # back on /auth?mode=reset&token=... in the SPA.
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email:
    # `console` (dev default, logs the reset link to stdout), `brevo` (prod -
    # HTTPS API, works on Render's free tier), or `smtp` (Gmail etc., requires
    # outbound SMTP egress which Render free blocks).
    mode: ${APP_EMAIL_MODE:console}
    from: ${APP_EMAIL_FROM:no-reply@contactnexus.local}
    from-name: ${APP_EMAIL_FROM_NAME:ContactNexus}
    brevo:
      api-key: ${BREVO_API_KEY:}
  password-reset:
    # Short enough to limit a stolen inbox, long enough for "do it after lunch".
    ttl: PT30M

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # Spring Boot auto-registers a MailHealthIndicator whenever
    # spring-boot-starter-mail is on the classpath. It opens a real SMTP
    # connection on every /actuator/health call, which blows up on Render
    # free (no outbound SMTP) and spams the logs with timeouts. Our email
    # path goes through the Brevo HTTPS API anyway, so the SMTP probe tells
    # us nothing.
    mail:
      enabled: false
