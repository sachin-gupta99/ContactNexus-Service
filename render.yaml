# Render blueprint - keeps the service configuration in git so a fresh Render
# account can bring the exact same environment up without clicking around the
# dashboard. Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: contactnexus-service
    runtime: docker
    plan: free
    region: singapore
    branch: main

    # Render builds from the Dockerfile at the repo root. Keeping it simple so
    # `docker build .` works identically in CI, locally, and here.
    dockerfilePath: ./Dockerfile

    # Spring Boot actuator endpoint. Render retries until it returns 200 before
    # routing traffic to a new deploy, so a failing migration fails the release
    # without flipping production over.
    healthCheckPath: /actuator/health

    # Allow all common HTTP methods + the Authorization header for the bearer
    # token and the Cookie/Set-Cookie pair for the refresh flow. Origins are
    # locked via CORS_ALLOWED_ORIGINS below, not here.
    envVars:
      # Short-lived access tokens ride in the Authorization header, so the
      # cookie only exists for /api/v1/auth. Flags below are the cross-origin
      # defaults: Vercel UI on *.vercel.app <-> Render API on *.onrender.com.
      - key: JWT_REFRESH_COOKIE_SECURE
        value: "true"
      - key: JWT_REFRESH_COOKIE_SAME_SITE
        value: None

      # Comma-separated, no trailing slash. Never use "*" with allowCredentials.
      # Override in the dashboard to add a staging origin later.
      - key: CORS_ALLOWED_ORIGINS
        value: https://contactnexus.vercel.app

      # Password-reset emails land back on the UI at /auth?mode=reset&token=...
      - key: APP_BASE_URL
        value: https://contactnexus.vercel.app

      # Render's free tier blocks outbound SMTP, so prod uses the Brevo
      # HTTPS API. `smtp` still works on paid Render plans or locally with
      # Gmail. `console` is the dev default - logs the reset link to stdout.
      - key: APP_EMAIL_MODE
        value: brevo
      - key: APP_EMAIL_FROM_NAME
        value: ContactNexus

      # Client IP for rate limiting (see ClientIpResolver). Render sits behind
      # Cloudflare, which sets CF-Connecting-IP itself; X-Forwarded-For is
      # appended to, so callers can forge its left-most value.
      - key: CLIENT_IP_EDGE_HEADER
        value: CF-Connecting-IP

      # Secrets live in the Render dashboard, not in git. `sync: false` tells
      # the blueprint "I know this variable, don't overwrite the value the
      # dashboard already holds" - set these once manually.
      - key: JWT_SECRET
        sync: false
      # Must equal ORIGIN_SECRET in the Vercel project (sent as X-Origin-Secret
      # on the /api rewrite). Generate with: openssl rand -base64 32
      - key: PROXY_SECRET
        sync: false
      # Same value as the JOBS_TOKEN GitHub secret used by .github/workflows/daily-jobs.yml.
      - key: JOBS_TOKEN
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # Brevo (ex-Sendinblue) Transactional Email API key. Scope the key to
      # Transactional Email only. APP_EMAIL_FROM must be the verified sender
      # address on Brevo (if you don't own a domain, Brevo's Single Sender
      # verification against any email you own - Gmail is fine - is enough).
      - key: BREVO_API_KEY
        sync: false
      - key: APP_EMAIL_FROM
        sync: false

      # Avatar storage: private S3 bucket, read through presigned URLs.
      - key: S3_BUCKET
        value: contact-nexus
      - key: S3_REGION
        value: ap-south-1
      # Keys of a dedicated IAM user scoped to s3:PutObject / GetObject /
      # DeleteObject on arn:aws:s3:::contact-nexus/avatars/* (see DEPLOY.md).
      # Never use an admin user's keys here.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # Kept for the SMTP code path - set these only if you flip APP_EMAIL_MODE
      # back to `smtp` (requires a Render paid plan or running elsewhere).
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
